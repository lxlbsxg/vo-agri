{% extends "base.html" %}

{% block title %}{{ doc.title }} - vo.agri{% endblock %}

{% block content %}

    {% if not request.args.get('embed') %}
        <p><a href="{{ url_for('documents') }}">&larr; My documents</a></p>
    {% endif %}

    <form method="POST" action="{{ url_for('save_document', doc_id=doc.id, embed=request.args.get('embed')) }}" id="doc-form" class="write-form">

        <div class="doc-title-row">
            <input
                type="text"
                name="title"
                id="doc-title"
                class="doc-title-input"
                value="{{ doc.title }}"
                placeholder="Untitled document"
            >
            <button type="button" id="doc-title-edit" class="title-edit-icon" title="Rename document">&#9998;</button>
        </div>

        <div class="editor-toolbar">
            <button type="button" data-command="bold"><strong>B</strong></button>
            <button type="button" data-command="insertUnorderedList">&bull; List</button>
        </div>

        <div id="doc-body" class="editor-body" contenteditable="true">{{ doc.body_html|safe }}</div>

        <input type="hidden" name="body_html" id="doc-body-input">
        <input type="hidden" name="annotations_json" id="annotations-input">

        <button type="submit" id="save-btn">Save document</button>

    </form>

    <script type="application/json" id="annotations-data">{{ annotations_json|safe }}</script>

    <script>
        // Tell the parent page (the "Write alongside" split view, if we're
        // loaded inside it) which papers are currently cited here, so it can
        // keep "Add to document" buttons in sync — greying out ones already
        // in the doc, and un-greying ones that just got removed + saved.
        if (window.parent && window.parent !== window) {
            var citationIds = Array.prototype.map.call(
                document.querySelectorAll(".citation-block[data-paper-id]"),
                function (el) { return el.dataset.paperId; }
            );
            window.parent.postMessage({ source: "vo-agri-write", citationIds: citationIds }, window.location.origin);
        }

        document.querySelectorAll(".editor-toolbar button").forEach(function (btn) {
            btn.addEventListener("click", function () {
                document.execCommand(btn.dataset.command, false, null);
                document.getElementById("doc-body").focus();
            });
        });

        document.getElementById("doc-title-edit").addEventListener("click", function () {
            var title = document.getElementById("doc-title");
            title.focus();
            title.select();
        });

        // Citation blocks carry their own remove button (contenteditable="false"
        // so it stays a real button rather than editable text). Removal only
        // needs to update the DOM here — it's persisted like any other edit,
        // when the user hits Save.
        document.getElementById("doc-body").addEventListener("click", function (event) {
            var removeBtn = event.target.closest(".citation-remove");
            if (!removeBtn) {
                return;
            }
            var block = removeBtn.closest(".citation-block");
            if (!block) {
                return;
            }
            var note = block.nextElementSibling;
            if (note && note.classList.contains("citation-note")) {
                note.remove();
            }
            block.remove();
        });

        // --- Annotations: select text -> highlight + note, saved with the document ---
        (function () {
            var docBody = document.getElementById("doc-body");
            var annotationsData = JSON.parse(document.getElementById("annotations-data").textContent || "{}");

            var floatingBtn = null;
            var floatingPanel = null;

            function clearFloatingUI() {
                if (floatingBtn) { floatingBtn.remove(); floatingBtn = null; }
                if (floatingPanel) { floatingPanel.remove(); floatingPanel = null; }
            }

            function positionNear(el, rect) {
                el.style.position = "absolute";
                el.style.left = (rect.left + window.scrollX) + "px";
                el.style.top = (rect.bottom + window.scrollY + 6) + "px";
            }

            function annotationCount(highlightId) {
                return (annotationsData[highlightId] || []).length;
            }

            function insertOrUpdateMarker(highlightSpan, highlightId) {
                var marker = docBody.querySelector('.annotation-marker[data-highlight-id="' + highlightId + '"]');
                if (!marker) {
                    marker = document.createElement("sup");
                    marker.className = "annotation-marker";
                    marker.dataset.highlightId = highlightId;
                    marker.contentEditable = "false";
                    highlightSpan.after(marker);
                }
                marker.textContent = "💬 " + annotationCount(highlightId);
            }

            function openAnnotationPanel(range, rect) {
                clearFloatingUI();

                var highlightId = (window.crypto && crypto.randomUUID)
                    ? crypto.randomUUID()
                    : ("h" + Date.now() + Math.random().toString(16).slice(2));

                var span = document.createElement("span");
                span.className = "annotation-highlight";
                span.dataset.highlightId = highlightId;
                span.appendChild(range.extractContents());
                range.insertNode(span);
                window.getSelection().removeAllRanges();

                floatingPanel = document.createElement("div");
                floatingPanel.className = "annotation-panel";
                positionNear(floatingPanel, rect);
                floatingPanel.innerHTML =
                    '<textarea placeholder="Add a note..."></textarea>' +
                    '<div class="annotation-panel-actions">' +
                    '<button type="button" class="btn-small annotation-save">Save</button>' +
                    '<button type="button" class="btn-small btn-disabled annotation-cancel">Cancel</button>' +
                    "</div>";
                document.body.appendChild(floatingPanel);

                var textarea = floatingPanel.querySelector("textarea");
                textarea.focus();

                floatingPanel.querySelector(".annotation-cancel").addEventListener("click", function () {
                    var parent = span.parentNode;
                    while (span.firstChild) parent.insertBefore(span.firstChild, span);
                    parent.removeChild(span);
                    clearFloatingUI();
                });

                floatingPanel.querySelector(".annotation-save").addEventListener("click", function () {
                    var text = textarea.value.trim();
                    if (!text) return;
                    if (!annotationsData[highlightId]) annotationsData[highlightId] = [];
                    annotationsData[highlightId].push(text);
                    insertOrUpdateMarker(span, highlightId);
                    clearFloatingUI();
                });
            }

            // Listening on `document` (not just docBody) matters: if the drag
            // ends even slightly outside the editor's box — easy to do with
            // an imprecise mouse/trackpad, or just a long selection near the
            // edge — the mouseup event fires on whatever element is under the
            // cursor there, which never reaches a listener scoped to docBody
            // alone. Whether the *selection* is actually inside the editor is
            // checked separately below, independent of where the event fired.
            document.addEventListener("mouseup", function (event) {
                if (event.target.closest(".annotation-add-btn, .annotation-panel")) {
                    // Ignore mouseup on our own floating button/panel — it
                    // has its own handlers, and re-running this logic here
                    // would immediately clear the panel it just opened.
                    return;
                }
                setTimeout(function () {
                    var selection = window.getSelection();
                    if (!selection || selection.isCollapsed || selection.rangeCount === 0) {
                        clearFloatingUI();
                        return;
                    }
                    var range = selection.getRangeAt(0);
                    if (!docBody.contains(range.commonAncestorContainer)) {
                        clearFloatingUI();
                        return;
                    }
                    clearFloatingUI();

                    var rect = range.getBoundingClientRect();
                    floatingBtn = document.createElement("button");
                    floatingBtn.type = "button";
                    floatingBtn.className = "btn-small annotation-add-btn";
                    floatingBtn.textContent = "Add annotation";
                    positionNear(floatingBtn, rect);
                    document.body.appendChild(floatingBtn);

                    var capturedRange = range.cloneRange();
                    floatingBtn.addEventListener("mousedown", function (event) {
                        // preventDefault keeps the browser from clearing the
                        // selection just from clicking this button
                        event.preventDefault();
                        openAnnotationPanel(capturedRange, rect);
                    });
                }, 0);
            });

            // Marker badges for annotations already saved from a previous visit
            Object.keys(annotationsData).forEach(function (highlightId) {
                var span = docBody.querySelector('.annotation-highlight[data-highlight-id="' + highlightId + '"]');
                if (span) insertOrUpdateMarker(span, highlightId);
            });

            // Click a marker to expand/collapse the notes on that highlight
            docBody.addEventListener("click", function (event) {
                var marker = event.target.closest(".annotation-marker");
                if (!marker) return;

                var highlightId = marker.dataset.highlightId;
                var existing = docBody.querySelector('.annotation-expanded[data-highlight-id="' + highlightId + '"]');
                if (existing) {
                    existing.remove();
                    return;
                }

                var list = document.createElement("div");
                list.className = "annotation-expanded";
                list.contentEditable = "false";
                list.dataset.highlightId = highlightId;
                (annotationsData[highlightId] || []).forEach(function (text) {
                    var p = document.createElement("p");
                    p.textContent = text;
                    list.appendChild(p);
                });
                marker.after(list);
            });

            document.getElementById("doc-form").addEventListener("submit", function () {
                // Expanded note panels are a transient view, not real document
                // content — strip them from a clone before saving so old
                // annotation text doesn't get baked into body_html itself.
                var clone = docBody.cloneNode(true);
                clone.querySelectorAll(".annotation-expanded").forEach(function (el) { el.remove(); });
                document.getElementById("doc-body-input").value = clone.innerHTML;
                document.getElementById("annotations-input").value = JSON.stringify(annotationsData);
            });
        })();
    </script>

{% endblock %}
